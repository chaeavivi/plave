# GitHub Pages 배포 (Actions 방식): typing/ (응원법 타자 연습) + simple/ (추천템 간단 버전)
#
# 현재 이 저장소의 Pages 는 "main 브랜치에서 배포" 로 설정되어 있어서 main 에 올리면 자동 배포됩니다.
# 나중에 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸면 이 워크플로를 수동 실행(workflow_dispatch)
# 하거나 아래 push 트리거의 주석을 풀어 기본 브랜치에서 바로 배포할 수 있습니다.
name: Deploy GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [claude/user-recommendation-page-espyyt]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 정적 파일 모으기
        run: |
          mkdir -p _site
          cp -r typing _site/typing
          cp -r simple _site/simple
          cp .github/pages-index.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
